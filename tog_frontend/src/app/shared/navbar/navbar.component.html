<div id="nav-marg">
  <mat-menu #menu="matMenu">
        <button mat-menu-item>Item 1</button>
        <button mat-menu-item>Item 2</button>
      </mat-menu>
      
  <mat-toolbar>  
    <section class="title-flex">
      <button matIconButton class="example-icon" aria-label="Example icon-button with menu icon" [matMenuTriggerFor]="menu">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="app-title"><a routerLink="/">The Old Gathering</a></span>
    </section>
    <span class="example-spacer"></span>
    <section>
      <div class="example-button-row">
        <button matButton="elevated" aria-label="Login button" routerLink="auth/login">
          Login
        </button>
        <button matButton="elevated" aria-label="Register Button" routerLink="auth/register">
          Register
        </button>
      </div>
    </section>
  </mat-toolbar>
</div>
