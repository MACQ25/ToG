@if(isLoading()){
    <mat-spinner [diameter]="24"></mat-spinner> 
}
@else{
    @if(predef()){
        @if(iePools()){
            <div class="chipPanels main" cdkDropListGroup>
                
                <app-chip-block 
                    *ngIf="chosen().justRotated && chosen().justRotated.length > 0"
                    ariaLabel="Rotated Out" cardTitle="Just Rotated" [chipCollection]="chosen().justRotated">
                </app-chip-block>

                <app-chip-block 
                    ariaLabel="Legal Post Rotation" cardTitle="Sets Legal" 
                    [chipCollection]="chosen().included" [isIEpool]="iePools()"
                    [alternateList]="chosen().toRelease"
                    (chipMoved)="move($event)"
                    >
                </app-chip-block>

                <app-chip-block
                    ariaLabel="Legal Before Next Rotation" cardTitle="To Be Released" 
                    [chipCollection]="chosen().toRelease" [isIEpool]="iePools()"
                    [alternateList]="chosen().included"
                    (chipMoved)="move($event)"
                    >
                </app-chip-block>

            </div>

            <div class="chipPanels secondary">
                
                <app-chip-block 
                    *ngIf="chosen().starterSet && chosen().starterSet.length > 0"
                    ariaLabel="Starter Sets Released on this time" cardTitle="Starter Sets" [chipCollection]="chosen().starterSet" [isPrimary]="false">
                </app-chip-block>

                <app-chip-block 
                    *ngIf="chosen().promo && chosen().promo.length > 0"
                    ariaLabel="Promos of associated sets" cardTitle="Promos" [chipCollection]="chosen().promo" [isPrimary]="false">
                </app-chip-block>

            </div>
        } 
        @else {
            <app-chip-block ariaLabel="sets in block" cardTitle="{{blockName()}} block" [chipCollection]="chosen()" ></app-chip-block>
        }

    } @else {
        <mat-form-field class="icons-field">
            <mat-label>Sets In Pool</mat-label>
            <mat-chip-grid #chipGrid aria-label="Enter sets" >
                @for (set of chosen(); track set) {
                
                    <mat-chip-row
                        (removed)="remove(set)"
                        [editable]="false"
                        [attr.aria-description]="'press enter to edit ' + set.name"
                    > 
                            <mat-icon [svgIcon]="set.icon" matChipAvatar></mat-icon>
                            {{set.name}}

                            <button matChipRemove [attr.aria-label]="'remove ' + set.name">
                                <mat-icon>cancel</mat-icon>
                            </button>
                        
                    </mat-chip-row>

                }
            </mat-chip-grid>    
            
            <input type="text" 
                matInput
                [formControl]="setSelectField"
                [matChipInputFor]="chipGrid"      
                [matAutocomplete]="auto.child"
                >
            <app-set-autocomplete 
                #auto 
                [control]="setSelectField" 
                [clearOnSelect]="true"
                [exclude]="exclusions()"
                (optionSelected)="onSetSelected($event)"
                />

        </mat-form-field>
    }
}
