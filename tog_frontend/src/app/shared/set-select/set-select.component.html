<div class="content">
    <mat-form-field>
        <ng-container matPrefix>
            @if(isLoading()) {
                <div class="spinnerPad">
                    <mat-spinner [diameter]="24"></mat-spinner> 
                </div>
            }
            @else {
                @if (selectedIcon(); as icon) {
                    <mat-icon [svgIcon]="icon"></mat-icon>
                } @else {
                    <mat-icon >search</mat-icon>
                }
            }
        </ng-container>

        
        <mat-label>{{ isLoading() ? "Tutoring options" : "Select an option" }}</mat-label>
        
        <input type="text" 
            matInput      
            [formControl]="setSelectField"
            (blur)="onTouched()"
            [matAutocomplete]="auto.child"
            >
        <app-set-autocomplete 
            #auto 
            [control]="setSelectField" 
            [blockMode]="blockMode()" 
            [(isLoading)]="isLoading"
            />


        @if (clearBtn()) {
            <button matSuffix matIconButton aria-label="Clear" type="button" (mousedown)="$event.preventDefault()" (click)="clear()">
                <mat-icon>close</mat-icon>
            </button>
        }
        
    </mat-form-field>

</div>
