<div class="content">
    <mat-form-field>
        @if (selectedIcon(); as icon) {
            <mat-icon matPrefix [svgIcon]="icon"></mat-icon>
        } @else {
            <mat-icon matPrefix>search</mat-icon>
        }
        
        <mat-label>Select an option</mat-label>
        
        <input type="text" matInput      
            [formControl]="setSelectField"
            (blur)="onTouched()"
            [matAutocomplete]="auto"
            >
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onChange($event.option.value)">
            @for(set of filteredOptions | async; track set.id){
                <mat-option [value]="set"> 
                    <div class="option-container">
                        <mat-icon [svgIcon]="set.icon"></mat-icon>
                        <span>{{ set.name }}</span>
                    </div> 
                </mat-option>
            }
        </mat-autocomplete>


        @if (clearBtn()) {
            <button matSuffix matIconButton aria-label="Clear" type="button" (mousedown)="$event.preventDefault()" (click)="clear()">
                <mat-icon>close</mat-icon>
            </button>
        }
        
    </mat-form-field>

</div>
